name: Build Linux Binaries

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            output: rclonetd-linux-amd64
          - arch: arm64
            output: rclonetd-linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          VERSION="$(cat VERSION 2>/dev/null || echo dev)"
          COMMIT="$(git rev-parse --short HEAD)"

          go build \
            -trimpath \
            -ldflags "-s -w -X github.com/rclone/rclone/fs.Version=${VERSION}-${COMMIT}" \
            -o "${{ matrix.output }}" \
            .

      - name: Verify binary
        run: |
          ls -lh "${{ matrix.output }}"
          file "${{ matrix.output }}"
          sha256sum "${{ matrix.output }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          if-no-files-found: error
